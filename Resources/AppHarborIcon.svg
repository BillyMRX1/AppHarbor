<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28587B"/>
      <stop offset="0.55" stop-color="#153B59"/>
      <stop offset="1" stop-color="#0A2942"/>
    </linearGradient>
    <linearGradient id="harbor-water" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3B8DA8"/>
      <stop offset="1" stop-color="#23647E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sea)"/>
  <!-- Calm water gathered inside the curve of a single protective breakwater. -->
  <path d="M222 663 C329 750 502 772 641 712 C703 685 750 636 779 582 C802 538 813 490 807 446 C745 498 695 553 638 603 C541 689 397 710 281 635 Z" fill="url(#harbor-water)"/>
  <!-- An open water lane leads from the harbor mouth into the sheltered basin. -->
  <path d="M385 372 C432 427 486 479 535 531 C571 569 605 598 641 618" fill="none" stroke="#73B9C8" stroke-width="17" stroke-linecap="round" opacity="0.82"/>
  <!-- One broad crescent wall shelters the inner water while leaving a wide northern entrance. -->
  <path d="M190 694 C321 832 596 842 782 660 C942 503 888 331 741 245 L704 308 C825 379 858 504 762 609 C622 762 370 752 241 625 Z" fill="#F0F2E9"/>
  <!-- A compact ferry enters level across the sheltered channel. -->
  <g>
    <path d="M274 420 L698 420 L637 500 C625 518 605 528 580 528 L360 528 C327 528 300 510 289 484 Z" fill="#F0F2E9"/>
    <path d="M390 420 L390 372 C390 363 398 356 407 356 L525 356 L574 420 Z" fill="#B8DCE4"/>
    <path d="M417 380 L451 380 L451 405 L417 405 Z M466 380 L501 380 L501 405 L466 405 Z" fill="#153B59"/>
  </g>
  <!-- Small lighthouse at the breakwater head. -->
  <path d="M715 240 L761 240 L754 286 L722 286 Z" fill="#F0F2E9"/>
  <path d="M708 241 L768 241 L757 226 L719 226 Z" fill="#F0F2E9"/>
  <circle cx="738" cy="213" r="13" fill="#F1B95B"/>
  <path d="M738 192 L738 183 M714 205 L707 201 M762 205 L769 201" fill="none" stroke="#F1B95B" stroke-width="7" stroke-linecap="round"/>
</svg>
