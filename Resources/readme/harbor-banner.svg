<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="390" viewBox="0 0 1600 390" role="img" aria-labelledby="title desc">
  <title id="title">AppHarbor for macOS</title>
  <desc id="desc">AppHarbor organizes supported Mac applications and package manager installs in one local library.</desc>
